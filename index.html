<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Casa — Итальянские диваны</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #faf7f2;
            color: #2c2c2c;
            line-height: 1.6;
        }

        /* HEADER */
        header {
            background: #1a1a1a;
            color: #fff;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #c9a96e;
        }
        .logo span { color: #fff; font-weight: 600; }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 2rem;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        nav a:hover { color: #c9a96e; }
